<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Foot Traffic Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .scanner-card { background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; padding: 30px; text-align: center; }
    h1 { color: #1a73e8; margin-bottom: 5px; font-size: 26px; }
    p.subtitle { color: #5f6368; font-size: 14px; margin-bottom: 25px; }
    .input-box { width: 100%; padding: 14px; font-size: 18px; text-align: center; border: 2px solid #1a73e8; border-radius: 8px; outline: none; margin-bottom: 20px; }
    .result-card { display: none; margin-top: 15px; padding: 20px; border-radius: 12px; background: #e8f0fe; border-left: 6px solid #1a73e8; text-align: left; }
    .result-card.error { background: #fce8e6; border-left-color: #d93025; }
    .result-card h2 { font-size: 20px; color: #202124; margin-bottom: 8px; }
    .result-card p { font-size: 15px; color: #3c4043; margin: 4px 0; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #1a73e8; color: white; margin-top: 8px; }
    .status-badge.unknown { background: #e37400; }
  </style>
</head>
<body>

  <div class="scanner-card">
    <h1>📚 Library Scanner</h1>
    <p class="subtitle">Please tap your ID card on the scanner</p>

    <!-- Scanner input -->
    <input type="text" id="scannerInput" class="input-box" placeholder="Ready to scan..." autofocus autocomplete="off">

    <div id="resultCard" class="result-card">
      <h2 id="resName">--</h2>
      <p><strong>User Type:</strong> <span id="resUserType">--</span></p>
      <p><strong>Department/Grade:</strong> <span id="resDept">--</span></p>
      <p><strong>Time:</strong> <span id="resTime">--</span></p>
      <span id="resBadge" class="status-badge">LOGGED</span>
    </div>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwajlwbbMBHBFWVzDP6-MzdA2Gf3SHvYFbU-dV6O7ZOldebIpsbH5W_o9XskeCPVUZfBA/exec";

    const input = document.getElementById('scannerInput');
    const resultCard = document.getElementById('resultCard');
    const resName = document.getElementById('resName');
    const resUserType = document.getElementById('resUserType');
    const resDept = document.getElementById('resDept');
    const resTime = document.getElementById('resTime');
    const resBadge = document.getElementById('resBadge');

    // Keep input field focused
    document.addEventListener('click', () => input.focus());

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const idVal = input.value.trim();
        if (idVal) {
          sendScan(idVal);
        }
        input.value = '';
      }
    });

    async function sendScan(scannedId) {
      try {
        // Send request as GET parameter to bypass CORS redirect restrictions
        const requestUrl = WEB_APP_URL + "?id=" + encodeURIComponent(scannedId);
        const response = await fetch(requestUrl);
        const res = await response.json();

        if (res.status === 'success') {
          showResult(res.data);
        } else {
          showError("Error processing scan");
        }
      } catch (err) {
        showError("Network Error / Check API Deployment");
      }
    }

    function showResult(data) {
      resultCard.className = 'result-card';
      resultCard.style.display = 'block';
      
      resName.textContent = data.name;
      resUserType.textContent = data.userType;
      resDept.textContent = data.deptGrade;
      resTime.textContent = data.time;

      if (data.found) {
        resBadge.className = 'status-badge';
        resBadge.textContent = 'SUCCESSFULLY LOGGED';
      } else {
        resBadge.className = 'status-badge unknown';
        resBadge.textContent = 'UNKNOWN ID LOGGED';
      }

      // Hide card after 4 seconds
      setTimeout(() => {
        resultCard.style.display = 'none';
      }, 4000);
    }

    function showError(msg) {
      resultCard.className = 'result-card error';
      resultCard.style.display = 'block';
      resName.textContent = msg;
      resUserType.textContent = '--';
      resDept.textContent = '--';
      resTime.textContent = '--';
      resBadge.className = 'status-badge';
      resBadge.textContent = 'ERROR';
      
      setTimeout(() => {
        resultCard.style.display = 'none';
      }, 4000);
    }
  </script>
</body>
</html>
